baseURL = 'https://andrewnplus.github.io/hugo-book-manager/'
languageCode = 'zh-tw'
title = 'Hugo Book Manager'

# Use Hugo Modules for theme
[module]
[[module.imports]]
  path = 'github.com/alex-shpak/hugo-book'

# Book configuration
disablePathToLower = true
enableGitInfo = true

# Needed for Mermaid/KaTeX shortcodes
[markup]
[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 1

[markup.goldmark.extensions.passthrough]
  enable = true

[markup.goldmark.extensions.passthrough.delimiters]
  block = [['$$', '$$']]
  inline = [['$', '$']]

# Multi-lingual mode config
# There are different defined schemes, defined in the i18n folder
# defaultContentLanguage = 'zh'
# defaultContentLanguageInSubdir = true

[params]
  # (Optional, default light) Sets color theme: light, dark or auto.
  # Theme 'auto' switches between dark and light modes based on browser/os preferences
  BookTheme = 'auto'

  # (Optional, default true) Controls table of contents visibility on right side of pages.
  # Start and end levels can be controlled with markup.tableOfContents setting.
  BookToC = true

  # (Optional, default favicon.png) Set the path to a favicon file.
  # If the favicon is /static/favicon.svg then the path would be favicon.svg
  # BookFavicon = 'favicon.svg'

  # (Optional, default none) Set the path to a logo for the book.
  # If the logo is /static/logo.png then the path would be logo.png
  # BookLogo = 'logo.png'

  # (Optional, default none) Set leaf bundle to render as side menu
  # When defined, the page tree with hierarchical structure of Hugo Book theme
  # will be flattened, enabling easier navigation from the side menu.
  # BookMenuBundle = '/menu'

  # (Optional, default docs) Specify root page to render child pages as menu.
  # Page is resoled by .GetPage function.
  BookSection = 'docs'

  # (Optional, default none) Set the path to a custom layout for a specific type of page
  # If layout is custom/index.html then specify "custom" here
  # BookLayout = 'custom'

  # Set source repository location.
  # Used for 'Last Modified' and 'Edit this page' links.
  BookRepo = 'https://github.com/Andrewnplus/hugo-book-manager'

  # (Optional, default 'commit') Specifies commit portion of the link to the page's last modified
  # commit hash for 'doc' page type.
  # Requires 'Owner' and 'Repo' variables.
  # Value used to construct a URL consisting of BookRepo/BookCommitPath/commit/hash
  # BookCommitPath = 'commit'

  # Enable "Edit this page" links for 'doc' page type.
  # Disabled by default. Uncomment to enable. Requires 'BookRepo' param.
  # Edit path must point to root directory of repo.
  BookEditPath = 'edit/main/docs/content'

  # Configure the date format used on the pages
  # - In git information
  # - In blog posts
  BookDateFormat = 'January 2, 2006'

  # (Optional, default true) Enables search function with flexsearch.
  BookSearch = true

  # (Optional, default false) Enables comments template on pages
  # By default, partials/docs/comments.html includes Disqus template
  # See https://gohugo.io/content-management/comments/#configure-disqus
  # Can be overwritten by same param in page frontmatter
  BookComments = false

  # /!\ This is an experimental feature, might be removed or changed at any time
  # (Optional, experimental, default false) Enables portable links and target section in the top navigation.
  # See https://github.com/alex-shpak/hugo-book/issues/523#issuecomment-1132777458
  # BookPortableLinks = true

  # /!\ This is an experimental feature, might be removed or changed at any time
  # (Optional, experimental, default false) Enables service worker that caches visited pages and offline search index.
  # See https://github.com/alex-shpak/hugo-book/issues/523#issuecomment-1161508099
  # BookServiceWorker = true

  # /!\ This is an experimental feature, might be removed or changed at any time
  # (Optional, experimental, default false) Enables a hierarchical structure for flattened section pages.
  # See https://github.com/alex-shpak/hugo-book/issues/212
  # BookFlatSection = true

  # (Optional) Shorthand for displaying GitHub repository stars
  # Usage: {{< github-stars >}}
  BookGitHubUser = 'Andrewnplus'
  BookGitHubRepo = 'hugo-book-manager'
