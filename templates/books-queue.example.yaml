# Books Queue - 批次建立書籍
# 執行: ./gradlew initBooks
#
# 狀態說明:
#   pending    - 等待處理
#   processing - AI 任務已產生，等待 Claude 處理
#   completed  - 已完成建立
#   duplicate  - repo 已存在，跳過建立
#   error      - 處理失敗
#
# 使用方式:
#   1. 複製此檔案為 books-queue.yaml
#   2. 在 books 列表中新增書籍資訊，status 設為 pending
#   3. 執行 ./gradlew initBooks
#   4. 依提示請 Claude 處理 AI 任務
#   5. 再次執行 ./gradlew initBooks 完成建立
#   6. 系統會自動處理下一本 pending 的書
#
# 進階用法（Gradle 不吃裸旗標，一律用 -P<key>=<value>）:
#   ./gradlew initBooks -Pstatus=true                # 顯示佇列狀態
#   ./gradlew initBooks -Pid=book-id                 # 只處理指定書籍
#   ./gradlew initBooks -Pid=book-id -Preset=true    # 重設狀態為 pending
#   ./gradlew initBooks -PdryRun=true                # 模擬不落地
#   ./gradlew initBooks -Pqueue=path/to/queue.yaml   # 指定其他 queue 檔

books:
-   id: example-book
    status: pending
    chinese_title: "範例書名"
    english_title: "Example Book Title"
    author: "Author Name"
    # 版權頁上的 ISBN-10。填了它，下面三欄就由 /book-import-to-queue 從
    # https://www.amazon.com/dp/<isbn> 抓，不必自己找；紙本書的 ISBN-10 即 ASIN。
    # 留空則三欄要自己填，或維持 "TODO"。
    isbn: "1234567890"
    publication_date: "January 1, 2025"
    cover_url: "https://example.com/cover.jpg"
    purchase_url: "https://www.amazon.com/example"
    table_of_contents: |
      Part I: Introduction
        Chapter 1: Getting Started
        Chapter 2: Overview
      Part II: Deep Dive
        Chapter 3: Core Concepts
        Chapter 4: Advanced Topics
